# ============================================
# PRODUCTION PROFILE CONFIGURATION
# ============================================
# This file is loaded when spring.profiles.active=prod

spring.application.name=elearing-backend-service

# ============================================
# Logging Configuration
# ============================================
# Production: Only log WARN and ERROR levels
logging.level.root=WARN
logging.level.com.doanptit.elearing_backend_service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ============================================
# CORS Configuration
# ============================================
# Will be overridden by environment variable APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://yourdomain.com}

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ============================================
# Database Configuration
# ============================================
# Will be overridden by environment variables from docker-compose.prod.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/elearning_prod?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:elearning_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# Flyway Configuration
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================
# Redis Configuration
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ============================================
# AWS Configuration
# ============================================
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.endpoint=
app.aws.access-key=${AWS_ACCESS_KEY_ID}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
app.aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT}
app.aws.dynamodb.blacklist-table-name=${AWS_DYNAMODB_BLACKLIST_TABLE_NAME:JwtBlacklist}

# ============================================
# Spring AI / OpenAI Configuration
# ============================================
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4}
spring.ai.openai.embedding.enabled=false
spring.ai.embedding.transformer.enabled=true
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.dimension=384

# ============================================
# Actuator Configuration (for health checks)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ============================================
# SpringDoc / Swagger Configuration
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

