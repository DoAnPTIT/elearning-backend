spring:
  application:
    name: elearning-backend-service

  datasource:
    url: jdbc:postgresql://localhost:5436/elearing-backend-service?sslfactory=org.postgresql.ssl.NonValidatingFactory
    username: elearningservice
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tagsSorter: alpha
