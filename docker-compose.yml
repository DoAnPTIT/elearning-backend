version: '3.8'

services:
  localstack:
    image: localstack/localstack
    environment:
      - DEBUG=true
      - EDGE_PORT=4566
      - EAGER_SERVICE_LOADING=true
      - AWS_DEFAULT_REGION=us-east-1
      - HOSTNAME_EXTERNAL=host.docker.internal
      - DEFAULT_REGION=us-east-1
      - LAMBDA_EXECUTOR=docker
      - "LAMBDA_DOCKER_FLAGS=--add-host host.docker.internal:host-gateway"
      - LAMBDA_DOCKER_NETWORK=elearning-backend-service-network
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    ports:
      - "4577:4566"
      - "4510-4559:4510-4559"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-data:/var/lib/localstack"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elearning-backend-service-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "./minio-data:/data"
    networks:
      - elearning-backend-service-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=elearing-backend-service
      - POSTGRES_USER=elearningservice
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - '5436:5432'
    volumes:
      - "./common-data/src/testFixtures/resources/sql:/docker-entrypoint-initdb.d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearningservice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - elearning-backend-service-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - elearning-backend-service-network

  recommendation-service:
    build:
      context: ../recommendation-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://elearningservice:password@postgres:5432/elearing-backend-service
      - REDIS_URL=redis://redis:6379/0
      - RETRAIN_INTERVAL_MINUTES=30
      - LOG_LEVEL=INFO
    volumes:
      - recommendation-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - elearning-backend-service-network
    restart: unless-stopped

networks:
  elearning-backend-service-network:
    driver: bridge
    name: elearning-backend-service-network

volumes:
  redis-data:
  recommendation-models:
