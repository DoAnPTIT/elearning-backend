name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: elearing-backend-service
          POSTGRES_USER: elearningservice
          POSTGRES_PASSWORD: password
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U elearningservice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        # Pinned: LocalStack images from the "latest" tag onward require a
        # LOCALSTACK_AUTH_TOKEN license, even for community features. 3.8 is
        # the last known version that runs unauthenticated with anonymous
        # credentials, which is what LocalStackDynamoDBConfig relies on.
        image: localstack/localstack:3.8
        env:
          SERVICES: dynamodb
        ports:
          - 4577:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
